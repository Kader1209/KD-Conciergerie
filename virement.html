<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virement bancaire - KD Conciergerie</title>
  <style>
    :root {
      --bg: #f8f5f1;
      --card: #fff;
      --text: #1f1f1f;
      --muted: #6d6d6d;
      --brand: #b79065;
      --brand-dark: #9b7a54;
      --line: #ece5dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .shell {
      max-width: 860px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      padding: 28px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.6vw, 2.1rem);
    }
    .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    .amount {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f3ece4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
    }
    .banner {
      margin-top: 12px;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }
    .banner.test { background: #fff4d8; color: #695100; }
    .banner.live { background: #e8f7ef; color: #16582e; }
    .rows {
      margin-top: 14px;
      border-top: 1px solid var(--line);
    }
    .row {
      display: grid;
      grid-template-columns: 170px 1fr auto;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
    }
    .row dt {
      font-weight: 600;
      color: #5e5e5e;
    }
    .row dd {
      margin: 0;
      word-break: break-word;
    }
    .copy-btn, .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn {
      background: #f2ece5;
      color: var(--text);
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    ul {
      margin: 10px 0 0;
      padding-left: 20px;
      color: #444;
      line-height: 1.5;
    }
    .error {
      margin-top: 12px;
      color: #a12c2c;
      font-weight: 600;
    }
    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/kd-theme.css?v=1" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Paiement par virement bancaire</h1>
      <p class="lead">Utilisez les coordonnées ci-dessous pour finaliser votre réservation. Indiquez bien la référence dans le libellé du virement.</p>
      <div class="amount">
        <span>Montant à virer</span>
        <strong id="amountValue">—</strong>
      </div>
      <div id="modeBanner" class="banner test" hidden></div>
      <dl class="rows" id="bankRows"></dl>
      <div id="instructions"></div>
      <p id="supportText"></p>
      <p class="error" id="errorText" hidden></p>
      <div class="actions">
        <a class="btn btn-primary" href="./reservation.html">Retour à la réservation</a>
        <a class="btn btn-primary" href="./contact.html">Nous contacter</a>
      </div>
    </section>
  </main>

  <script>
    const BANK_TRANSFER_FUNCTION_URL = "https://oyhddkzdnwxbectbdzdl.supabase.co/functions/v1/bank-transfer-info";

    const params = new URLSearchParams(window.location.search);
    const amountFromQuery = Number(params.get("amount") || 0);
    const bookingId = String(params.get("id") || "").trim() || null;
    const adults = Number(params.get("adults") || 0);
    const children = Number(params.get("children") || 0);
    const babies = Number(params.get("babies") || 0);

    const formatMoney = (value) =>
      new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 })
        .format(Number(value || 0));

    const escapeHtml = (value) =>
      String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const copyToClipboard = async (value, button) => {
      try {
        await navigator.clipboard.writeText(value);
        button.textContent = "Copié";
        window.setTimeout(() => { button.textContent = "Copier"; }, 1300);
      } catch {
        button.textContent = "Erreur copie";
        window.setTimeout(() => { button.textContent = "Copier"; }, 1300);
      }
    };

    const render = (info) => {
      document.getElementById("amountValue").textContent =
        info?.amountFormatted || (Number.isFinite(amountFromQuery) && amountFromQuery > 0 ? formatMoney(amountFromQuery) : "—");

      const banner = document.getElementById("modeBanner");
      const isTest = info?.mode !== "live";
      banner.hidden = false;
      banner.className = `banner ${isTest ? "test" : "live"}`;
      banner.textContent = isTest
        ? (info?.notice || "Coordonnées de test — n'effectuez aucun virement réel.")
        : "Coordonnées officielles — virement vers KD Conciergerie.";

      const rows = [
        { label: "Bénéficiaire", value: info?.bank?.beneficiary, copy: info?.bank?.beneficiary },
        { label: "IBAN", value: info?.bank?.iban, copy: (info?.bank?.iban || "").replace(/\s+/g, "") },
        { label: "BIC / SWIFT", value: info?.bank?.bic, copy: info?.bank?.bic },
        { label: "Banque", value: info?.bank?.name, copy: info?.bank?.name },
        { label: "Adresse banque", value: info?.bank?.address, copy: info?.bank?.address },
        { label: "Référence", value: info?.reference, copy: info?.reference }
      ];

      const rowsEl = document.getElementById("bankRows");
      rowsEl.innerHTML = rows.filter((r) => r.value).map((r) => `
        <div class="row">
          <dt>${escapeHtml(r.label)}</dt>
          <dd>${escapeHtml(r.value)}</dd>
          <button type="button" class="copy-btn" data-copy="${escapeHtml(r.copy || r.value)}">Copier</button>
        </div>
      `).join("");

      rowsEl.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", () => copyToClipboard(btn.getAttribute("data-copy") || "", btn));
      });

      const steps = Array.isArray(info?.instructions) ? info.instructions : [];
      document.getElementById("instructions").innerHTML = steps.length
        ? `<ul>${steps.map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ul>`
        : "";

      const support = info?.support?.email;
      document.getElementById("supportText").innerHTML = support
        ? `Besoin d'aide ? Écrivez-nous à <a href="mailto:${escapeHtml(support)}">${escapeHtml(support)}</a>.`
        : "";
    };

    const showError = (message) => {
      const el = document.getElementById("errorText");
      el.hidden = false;
      el.textContent = message;
    };

    const readGuestFromStorage = () => {
      try {
        const raw = window.sessionStorage.getItem("kd-guest-contact");
        if (!raw) return {};
        const o = JSON.parse(raw);
        return typeof o === "object" && o ? o : {};
      } catch {
        return {};
      }
    };

    const loadTransferInfo = async () => {
      const guests = Math.max(0, adults) + Math.max(0, children) + Math.max(0, babies);
      const description = guests > 0
        ? `Réservation KD Conciergerie (${guests} voyageur${guests > 1 ? "s" : ""})`
        : "Réservation KD Conciergerie";

      const guest = readGuestFromStorage();
      const arrive = params.get("arrive");
      const depart = params.get("depart");
      let staySummary = "";
      if (arrive && depart) {
        const df = (d) => new Date(d).toLocaleDateString("fr-FR");
        staySummary = `Du ${df(arrive)} au ${df(depart)}`;
      }

      const response = await fetch(BANK_TRANSFER_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          amount: Number.isFinite(amountFromQuery) && amountFromQuery > 0 ? amountFromQuery : null,
          bookingId,
          description,
          customerEmail: typeof guest.email === "string" ? guest.email.trim() : null,
          customerPhone: typeof guest.phone === "string" ? guest.phone.trim() : null,
          guestFirstName: typeof guest.guestFirstName === "string" ? guest.guestFirstName.trim() : null,
          propertyTitle: typeof guest.propertyTitle === "string" ? guest.propertyTitle.trim() : null,
          staySummary: staySummary || null
        })
      });

      const contentType = response.headers.get("content-type") || "";
      const payload = contentType.includes("application/json")
        ? await response.json()
        : { error: await response.text() };

      if (!response.ok) {
        throw new Error(String(payload?.error || payload?.message || `Erreur serveur (${response.status})`));
      }
      return payload;
    };

    (async () => {
      try {
        const info = await loadTransferInfo();
        render(info);
      } catch (error) {
        console.error(error);
        showError("Impossible de charger les coordonnées de virement pour le moment. Merci de réessayer dans quelques minutes.");
      }
    })();
  </script>
</body>
</html>
